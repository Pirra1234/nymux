<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nymux Network - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">NYMUX</div>
        <ul class="nav-links">
            <li><a href="index.html">← Volver al Inicio</a></li>
        </ul>
    </nav>

    <div class="form-section">
        <div class="form-box">
            <h2>Crear Cuenta</h2>
            <form>
                <div class="input-group">
                    <label>Usuario de Minecraft</label>
                    <input type="text" placeholder="Nombre exacto" required>
                </div>
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="tu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Crea una contraseña segura" required>
                </div>
                <button type="submit" class="form-btn">REGISTRARSE</button>
            </form>
            <span class="form-link">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></span>
        </div>
    </div>

</body>
</html>
